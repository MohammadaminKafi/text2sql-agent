# Database Configuration Profiles
# This file defines connection profiles for different databases

database_profiles:
  # SQL Server with Windows Authentication
  mssql_adventureworks:
    type: mssql
    connection_type: windows_auth
    driver: "ODBC Driver 18 for SQL Server"
    host: "localhost"
    port: 1433
    database: "AdventureWorks2022"
    encrypt: "yes"
    trust_server_certificate: "yes"
    description: "Local SQL Server AdventureWorks with Windows Auth"

  # SQL Server with Docker (Custom Auth)
  mssql_docker:
    type: mssql
    connection_type: sql_auth
    driver: "ODBC Driver 18 for SQL Server"
    host: "${MSSQL_HOST:-sqlserver}"
    port: "${MSSQL_PORT:-1433}"
    database: "${MSSQL_DB:-AdventureWorks2022}"
    user: "${MSSQL_USER:-sa}"
    password: "${MSSQL_PASSWORD}"
    encrypt: "${MSSQL_ENCRYPT:-yes}"
    trust_server_certificate: "${MSSQL_TRUST_SERVER_CERT:-yes}"
    description: "Docker SQL Server with SQL Auth"

  # Custom SQL Server instance
  mssql_custom:
    type: mssql
    connection_type: sql_auth
    driver: "ODBC Driver 18 for SQL Server"
    host: "${CUSTOM_MSSQL_HOST}"
    port: "${CUSTOM_MSSQL_PORT:-1433}"
    database: "${CUSTOM_MSSQL_DB}"
    user: "${CUSTOM_MSSQL_USER}"
    password: "${CUSTOM_MSSQL_PASSWORD}"
    encrypt: "${CUSTOM_MSSQL_ENCRYPT:-no}"
    trust_server_certificate: "${CUSTOM_MSSQL_TRUST_CERT:-no}"
    description: "Custom SQL Server instance"

  # Snowflake connection
  snowflake_default:
    type: snowflake
    account: "${SNOWFLAKE_ACCOUNT}"
    warehouse: "${SNOWFLAKE_WAREHOUSE:-COMPUTE_WH_PARTICIPANT}"
    database: "${SNOWFLAKE_DATABASE}"
    user: "${SNOWFLAKE_USER}"
    password: "${SNOWFLAKE_PASSWORD}"
    role: "${SNOWFLAKE_ROLE:-PARTICIPANT}"
    description: "Snowflake cloud warehouse"

  # SQLite local database
  sqlite_local:
    type: sqlite
    database_path: "${SQLITE_DB_PATH:-./data/local.db}"
    description: "Local SQLite database"

  # SQLite in-memory database (for testing)
  sqlite_memory:
    type: sqlite
    database_path: ":memory:"
    description: "In-memory SQLite database for testing"

# Default profile to use when none is specified
default_profile: "mssql_docker"

# Profile aliases for backwards compatibility
aliases:
  mssql: "mssql_docker"
  snowflake: "snowflake_default"
  sqlite: "sqlite_local"